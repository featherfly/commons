apply plugin: 'java-library'
// apply plugin: 'maven-publish'

import java.io.File;

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(jdkVersion as Integer)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
tasks.withType(Javadoc) {
    options.encoding = "UTF-8"
    options.locale = "en"
    File overview = new File(getProjectDir().getAbsolutePath() + '/src/main/javadoc/overview.html'); 
    //println overview.getAbsolutePath() + " exits " + overview.exists()
    if (overview.exists()) {
        options.overview = overview.getAbsolutePath()
    }
}

  


jar {
    archiveBaseName = archivesBaseName
    manifest.attributes 'Build-Name': archivesBaseName
    manifest.attributes 'Build-By': "zhongj"
    manifest.attributes 'Build-JDK' : jdkVersion
    manifest.attributes 'Build-Tool' : "gradle " + gradle.gradleVersion
    manifest.attributes 'Build-Tool-JDK' : ant.properties['java.runtime.version']
    manifest.attributes 'Build-OS' : ant.properties['os.name'] + "  --  " + ant.properties['os.version'] + "  --  " + ant.properties['os.arch']
    manifest.attributes 'Build-User' : ant.properties["user.name"]
    manifest.attributes 'Bundle-License': 'http://www.apache.org/licenses/LICENSE-2.0'
}

